<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/cadastro.css" />
  <title>Cadastro | Luiza Busnardo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="cabecalho">
    <h1 class="logotipo"><a href="login.html">Luiza Busnardo</a></h1>
    <p class="subtitulo">CONSULTÓRIO FONOAUDIOLÓGICO</p>
  </header>

  <main class="estrutura">
    <section class="painel-cadastro">
      <form class="formulario-cadastro" id="formularioCadastro" novalidate>
        <p class="destaque">VAMOS COMEÇAR</p>
        <h1>Crie sua conta.</h1>
        <p class="descricao">Um primeiro passo para se conectar ao seu cuidado.</p>

        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" maxlength="45" autocomplete="name" />
          <span class="erro" id="erroNome" role="alert"></span>
        </div>

        <div class="campo">
          <label for="dataNascimento">Data de nascimento</label>
          <input id="dataNascimento" name="dataNascimento" type="text" placeholder="DD/MM/AAAA" inputmode="numeric" autocomplete="bday" />
          <span class="erro" id="erroDataNascimento" role="alert"></span>
        </div>

        <div class="campo">
          <label for="cpf">CPF</label>
          <input id="cpf" name="cpf" type="text" placeholder="12345678900" maxlength="11" inputmode="numeric" autocomplete="off" />
          <span class="erro" id="erroCpf" role="alert"></span>
        </div>

        <div class="campo">
          <label for="telefone">Telefone celular</label>
          <input id="telefone" name="telefone" type="tel" placeholder="21999999999" maxlength="11" inputmode="numeric" autocomplete="tel" />
          <span class="erro" id="erroTelefone" role="alert"></span>
        </div>

        <div class="campo">
          <label for="enderecoCompleto">Endereço completo</label>
          <input id="enderecoCompleto" name="enderecoCompleto" type="text" autocomplete="street-address" />
          <span class="erro" id="erroEnderecoCompleto" role="alert"></span>
        </div>

        <div class="campo">
          <label for="login">Login</label>
          <input id="login" name="login" type="text" maxlength="6" autocomplete="username" />
          <span class="erro" id="erroLogin" role="alert"></span>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="controle-senha">
            <input id="senha" name="senha" type="password" maxlength="8" autocomplete="new-password" />
            <button class="alternar-senha" type="button" data-alvo="senha" aria-label="Mostrar senha">◉</button>
          </div>
          <span class="erro" id="erroSenha" role="alert"></span>
        </div>

        <div class="campo">
          <label for="confirmarSenha">Confirmar senha</label>
          <div class="controle-senha">
            <input id="confirmarSenha" name="confirmarSenha" type="password" maxlength="8" autocomplete="new-password" />
            <button class="alternar-senha" type="button" data-alvo="confirmarSenha" aria-label="Mostrar senha">◉</button>
          </div>
          <span class="erro" id="erroConfirmarSenha" role="alert"></span>
        </div>

        <button class="botao-principal" type="submit">Criar minha conta</button>
        <p class="mensagem" id="mensagem" role="status" aria-live="polite"></p>

        <div class="divisor">Já tem uma conta? <a href="login.html">Entrar</a></div>
      </form>
    </section>
  </main>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
  <script src="js/cadastro.js"></script>
</body>
</html>
